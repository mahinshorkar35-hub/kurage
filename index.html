<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Dither · Lasers · Reveal</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#030303;color:#fff;font-family:system-ui,-apple-system,sans-serif;overflow-x:hidden}

.dither-bg{position:fixed;inset:0;z-index:0;width:100vw;height:100vh;pointer-events:none;background:#030303}
.lasers-bg{position:fixed;inset:0;z-index:1;width:100vw;height:100vh;pointer-events:none}

.content{position:relative;z-index:2;max-width:1040px;margin:0 auto;padding:5rem 2rem 6rem}

header{margin-bottom:4.5rem}
header h1{font-size:.75rem;font-weight:500;text-transform:uppercase;letter-spacing:.15em;color:rgba(255,255,255,.25);margin-bottom:.75rem}
header p{font-size:1.05rem;line-height:1.7;color:rgba(255,255,255,.5);max-width:520px}

.gallery{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem}

.card{position:relative;overflow:clip;isolation:isolate;contain:paint;background:#0a0a0a;cursor:crosshair;width:100%;aspect-ratio:16/10}
.card img{display:block;width:100%;height:100%;object-fit:cover;object-position:center;user-select:none;-webkit-user-select:none}
.card__base{position:relative;z-index:0;filter:grayscale(1) contrast(1.1) brightness(.65)}
.card__overlay{position:absolute;z-index:1;inset:0;pointer-events:none;
-webkit-mask-image:radial-gradient(circle var(--r,0px) at var(--rx,50%) var(--ry,50%),
  rgb(0 0 0 / 1) 0%,rgb(0 0 0 / 1) 40%,rgb(0 0 0 / .75) 60%,rgb(0 0 0 / .4) 75%,rgb(0 0 0 / .12) 88%,transparent 100%);
mask-image:radial-gradient(circle var(--r,0px) at var(--rx,50%) var(--ry,50%),
  rgb(0 0 0 / 1) 0%,rgb(0 0 0 / 1) 40%,rgb(0 0 0 / .75) 60%,rgb(0 0 0 / .4) 75%,rgb(0 0 0 / .12) 88%,transparent 100%);
-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
.card__label{position:absolute;bottom:.75rem;left:.75rem;z-index:2;font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.2);pointer-events:none}

@media(hover:none),(pointer:coarse){.card__overlay{display:none}}
@media(max-width:640px){.gallery{grid-template-columns:1fr}.content{padding:3rem 1rem 4rem}}
</style>
</head>
<body>

<canvas class="dither-bg" id="dither"></canvas>
<canvas class="lasers-bg" id="lasers"></canvas>

<div class="content">
  <header>
    <h1>MengTo Skills — Demo</h1>
    <p>Dither background, corner lasers, and reveal-hover combined in a single atmospheric gallery.</p>
  </header>
  <div class="gallery">
    <figure class="card" data-reveal>
      <img class="card__base" src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=800&q=80" alt="" width="800" height="500" decoding="async" loading="lazy"/>
      <img class="card__overlay" src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=800&q=80" alt="" aria-hidden="true" width="800" height="500" decoding="async" loading="lazy"/>
      <span class="card__label">hover to reveal</span>
    </figure>
    <figure class="card" data-reveal>
      <img class="card__base" src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=800&q=80" alt="" width="800" height="500" decoding="async" loading="lazy"/>
      <img class="card__overlay" src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=800&q=80" alt="" aria-hidden="true" width="800" height="500" decoding="async" loading="lazy"/>
      <span class="card__label">hover to reveal</span>
    </figure>
    <figure class="card" data-reveal>
      <img class="card__base" src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=800&q=80" alt="" width="800" height="500" decoding="async" loading="lazy"/>
      <img class="card__overlay" src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=800&q=80" alt="" aria-hidden="true" width="800" height="500" decoding="async" loading="lazy"/>
      <span class="card__label">hover to reveal</span>
    </figure>
    <figure class="card" data-reveal>
      <img class="card__base" src="https://images.unsplash.com/photo-1505144808419-1957a94ca61e?w=800&q=80" alt="" width="800" height="500" decoding="async" loading="lazy"/>
      <img class="card__overlay" src="https://images.unsplash.com/photo-1505144808419-1957a94ca61e?w=800&q=80" alt="" aria-hidden="true" width="800" height="500" decoding="async" loading="lazy"/>
      <span class="card__label">hover to reveal</span>
    </figure>
  </div>
</div>

<script>
// ─── Dither background ──────────────────────────────────────────
(function(){
const BAYER=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5].map(function(v){return(v+.5)/16});
function ss(e0,e1,v){var t=Math.max(0,Math.min(1,(v-e0)/(e1-e0)));return t*t*(3-2*t)}
function vn(x,y){
  var ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy,ux=fx*fx*(3-2*fx),uy=fy*fy*(3-2*fy);
  var a=Math.sin(ix*127.1+iy*311.7)*43758.5453123;a=a-Math.floor(a);
  var b=Math.sin((ix+1)*127.1+iy*311.7)*43758.5453123;b=b-Math.floor(b);
  var c=Math.sin(ix*127.1+(iy+1)*311.7)*43758.5453123;c=c-Math.floor(c);
  var d=Math.sin((ix+1)*127.1+(iy+1)*311.7)*43758.5453123;d=d-Math.floor(d);
  return a*(1-ux)*(1-uy)+b*ux*(1-uy)+c*(1-ux)*uy+d*ux*uy
}
function fbm(x,y){var v=0,a=.5,f=1;for(var i=0;i<4;i++){v+=vn(x*f,y*f)*a;f*=2.02;a*=.5}return v}
var c=document.getElementById('dither'),ctx=c.getContext('2d',{alpha:false});
var palette=[[3,3,3],[16,16,17],[34,35,37],[74,75,78],[168,169,171],[236,236,232]];
var W=1,H=1,C=1,R=1,raf=0;
function resize(){
  var dpr=Math.min(window.devicePixelRatio||1,1.5);
  W=window.innerWidth;H=window.innerHeight;
  c.width=Math.floor(W*dpr);c.height=Math.floor(H*dpr);
  c.style.width=W+'px';c.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);C=Math.ceil(W/7);R=Math.ceil(H/7)
}
function field(x,y,t){
  var nx=(x/C-.5)*2,ny=(y/R-.5)*2,d=Math.sqrt(nx*nx*.84+ny*ny*1.28),vig=1-ss(.18,1.15,d),dr=t*.018;
  var wave=Math.sin(nx*2.8+ny*1.2+dr)*.18+Math.sin(nx*-1.4+ny*3.8-dr*.8)*.14;
  var cloud=fbm(nx*1.35+dr*.16,ny*1.35-dr*.08);
  var ridge=ss(.48,.92,cloud+wave);
  var oam=ss(.98,.18,Math.hypot(nx+.22,ny-.08));
  return Math.max(0,Math.min(1,ridge*vig*.92+oam*.18))
}
function draw(t){
  var s=t*.001;
  ctx.fillStyle='rgb(3,3,3)';ctx.fillRect(0,0,W,H);
  for(var y=0;y<R;y++)for(var x=0;x<C;x++){
    var th=BAYER[(y%4)*4+(x%4)],br=field(x,y,s),st=Math.floor(Math.max(0,Math.min(.999,br+th*.18))*palette.length);
    var p=palette[Math.min(palette.length-1,st)];
    ctx.fillStyle='rgb('+p[0]+','+p[1]+','+p[2]+')';ctx.fillRect(x*7,y*7,7,7)
  }
  raf=requestAnimationFrame(draw)
}
resize();draw(0);
window.addEventListener('resize',function(){cancelAnimationFrame(raf);resize();draw(0)});
})();

// ─── Corner lasers (WebGL) ──────────────────────────────────────
(function initLasers(){
var c=document.getElementById('lasers');
c.width=window.innerWidth;
c.height=window.innerHeight;
var gl=c.getContext('webgl',{alpha:true,premultipliedAlpha:false});
if(!gl){console.error('no gl');return}

gl.enable(gl.BLEND);
gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);

var vSrc='attribute vec2 pos;void main(){gl_Position=vec4(pos,0,1)}';
var fSrc='precision highp float;uniform vec2 res;uniform float time;void main(){'+
  'vec2 uv=gl_FragCoord.xy/res;vec2 e=vec2(0.18,0.72);vec2 p=uv-e;'+
  'vec2 d1=vec2(0.943,0.332);vec2 d2=vec2(0.148,0.988);vec2 d3=vec2(0.998,-0.061);'+
  'float nd1=abs(dot(p,vec2(-d1.y,d1.x)));float nd2=abs(dot(p,vec2(-d2.y,d2.x)));float nd3=abs(dot(p,vec2(-d3.y,d3.x)));'+
  'float f1=step(-0.02,dot(p,d1));float f2=step(-0.02,dot(p,d2));float f3=step(-0.02,dot(p,d3));'+
  'float beam=f1*exp(-nd1*300.)+f2*exp(-nd2*300.)+f3*exp(-nd3*300.);'+
  'float glow=f1*exp(-nd1*20.)*0.08+f2*exp(-nd2*20.)*0.08+f3*exp(-nd3*20.)*0.08;'+
  'float de=length(p);float haze=exp(-de*2.)*0.15;float total=beam+glow+haze;'+
  'vec3 col=mix(vec3(total),vec3(1.,0.9,0.6),clamp(total*0.3,0.,1.));'+
  'gl_FragColor=vec4(col,total*0.65+0.12);}';

function mkShader(t,s){var sh=gl.createShader(t);gl.shaderSource(sh,s);gl.compileShader(sh);if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS)){console.error('shader err:',gl.getShaderInfoLog(sh));return null}return sh}
var vs=mkShader(gl.VERTEX_SHADER,vSrc),fs=mkShader(gl.FRAGMENT_SHADER,fSrc);
if(!vs||!fs){console.error('shader fail');return}

var prog=gl.createProgram();gl.attachShader(prog,vs);gl.attachShader(prog,fs);gl.linkProgram(prog);
if(!gl.getProgramParameter(prog,gl.LINK_STATUS)){console.error('link err:',gl.getProgramInfoLog(prog));return}
gl.useProgram(prog);

gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);

var rL=gl.getUniformLocation(prog,'res'),tL=gl.getUniformLocation(prog,'time');
gl.viewport(0,0,c.width,c.height);

var start=performance.now();
function loop(){
  gl.uniform2f(rL,c.width,c.height);
  gl.uniform1f(tL,(performance.now()-start)/1000);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  requestAnimationFrame(loop)
}
loop();

window.addEventListener('resize',function(){
  c.width=window.innerWidth;c.height=window.innerHeight;
  gl.viewport(0,0,c.width,c.height);
});
})();

// ─── Reveal hover ────────────────────────────────────────────────
(function(){
var reduce=window.matchMedia('(prefers-reduced-motion: reduce)');
var fine=window.matchMedia('(hover: hover) and (pointer: fine)');

document.querySelectorAll('[data-reveal]').forEach(function(el){
  var ov=el.querySelector('.card__overlay');
  if(!ov||!fine.matches)return;
  var s={x:0,y:0,tx:0,ty:0,r:0,tr:0,cx:0,cy:0,in:false,f:0};
  function sch(){if(!s.f)s.f=requestAnimationFrame(tk)}
  function tk(){
    s.f=0;
    var pe=reduce.matches?1:.1,re=reduce.matches?1:.14;
    s.x+=(s.tx-s.x)*pe;s.y+=(s.ty-s.y)*pe;s.r+=(s.tr-s.r)*re;
    el.style.setProperty('--rx',s.x.toFixed(2)+'px');
    el.style.setProperty('--ry',s.y.toFixed(2)+'px');
    el.style.setProperty('--r',s.r.toFixed(2)+'px');
    if(Math.abs(s.tx-s.x)>.1||Math.abs(s.ty-s.y)>.1||Math.abs(s.tr-s.r)>.1)sch()
  }
  function ut(cx,cy){var r=el.getBoundingClientRect();s.cx=cx;s.cy=cy;s.tx=cx-r.left;s.ty=cy-r.top}
  function rad(){return Math.min(260,Math.max(140,el.clientWidth*.22))}
  el.addEventListener('pointerenter',function(e){s.in=true;ut(e.clientX,e.clientY);if(s.r<.5){s.x=s.tx;s.y=s.ty}s.tr=rad();sch()});
  el.addEventListener('pointermove',function(e){ut(e.clientX,e.clientY);if(!s.in){s.in=true;if(s.r<.5){s.x=s.tx;s.y=s.ty}s.tr=rad()}sch()});
  el.addEventListener('pointerleave',function(){s.in=false;s.tr=0;sch()});
  el.addEventListener('pointercancel',function(){s.in=false;s.tr=0;sch()});
  window.addEventListener('blur',function(){s.in=false;s.tr=0;sch()});
  window.addEventListener('scroll',function(){if(s.in){ut(s.cx,s.cy);s.tr=rad();sch()}},{passive:true});
  var ro=new ResizeObserver(function(){if(s.in){ut(s.cx,s.cy);s.tr=rad();sch()}});
  ro.observe(el)
});
})();
</script>
</body>
</html>
