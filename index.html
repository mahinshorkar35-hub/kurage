<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Kurage · Arena</title>
<style>
*{margin:0;padding:0}
body{background:#000;overflow:hidden;height:100dvh;font-family:system-ui,-apple-system,sans-serif}
canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
#hp{position:fixed;bottom:2rem;left:2rem;width:180px;height:4px;background:rgba(255,255,255,.06);z-index:10}
#hp-fill{height:100%;width:100%;background:rgba(255,255,255,.6);transition:width .3s}
#score{position:fixed;top:1.5rem;right:2rem;font-size:.85rem;font-weight:600;color:rgba(255,255,255,.25);letter-spacing:.1em;z-index:10}
#wave{position:fixed;top:1.5rem;left:2rem;font-size:.7rem;font-weight:500;color:rgba(255,255,255,.12);letter-spacing:.12em;text-transform:uppercase;z-index:10}
#crosshair{position:fixed;z-index:11;pointer-events:none;width:20px;height:20px;transform:translate(-50%,-50%)}
#crosshair::before,#crosshair::after{content:"";position:absolute;background:rgba(255,255,255,.15)}
#crosshair::before{width:1px;height:100%;left:50%}
#crosshair::after{width:100%;height:1px;top:50%}
#over{position:fixed;inset:0;display:none;place-items:center;z-index:20;background:rgba(0,0,0,.6);backdrop-filter:blur(12px)}
#over.show{display:grid}
#over div{text-align:center}
#over h1{font-size:3rem;font-weight:800;letter-spacing:-.04em;color:#fff;margin-bottom:.5rem}
#over p{color:rgba(255,255,255,.2);font-size:.8rem;letter-spacing:.1em;text-transform:uppercase}
#over .sc{font-size:1.3rem;font-weight:700;color:rgba(255,255,255,.4);margin-top:2rem}
#over .wa{font-size:.9rem;color:rgba(255,255,255,.12);margin-top:.5rem}
#start{position:fixed;inset:0;display:grid;place-items:center;z-index:15;cursor:pointer}
#start.hide{display:none}
#start h1{font-size:clamp(2.5rem,8vw,5rem);font-weight:800;letter-spacing:-.04em;color:#fff;margin-bottom:.75rem}
#start p{color:rgba(255,255,255,.2);font-size:.8rem;letter-spacing:.1em;text-transform:uppercase}
#start .kc{margin-top:1.5rem;display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap}
#start .kc kbd{border:1px solid rgba(255,255,255,.07);padding:.25rem .5rem;font-size:.65rem;color:rgba(255,255,255,.1);font-family:inherit;letter-spacing:.05em}
@media(max-width:640px){#crosshair{display:none}}
</style>
</head>
<body>

<div id="start">
  <div style="text-align:center">
    <h1>Arena</h1>
    <p>Survive the waves</p>
    <div class="kc"><kbd>W A S D</kbd><kbd>move</kbd><kbd>click</kbd><kbd>shoot</kbd></div>
    <p style="margin-top:2rem;color:rgba(255,255,255,.06);font-size:.7rem">click to start</p>
  </div>
</div>

<div id="over">
  <div>
    <h1>Consumed</h1>
    <p class="sc" id="final-sc">0</p>
    <p class="wa" id="final-wa">Wave 0</p>
    <p style="margin-top:1.5rem;color:rgba(255,255,255,.08);font-size:.7rem">click to retry</p>
  </div>
</div>

<div id="hud">
  <div id="hp"><div id="hp-fill"></div></div>
  <div id="wave">Wave 1</div>
  <div id="score">0</div>
  <div id="crosshair"></div>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}
</script>

<script type="module">
import * as THREE from 'three';

// ─── Scene ─────────────────────────────────────────────────────
var scene=new THREE.Scene();
scene.background=new THREE.Color('#030303');
scene.fog=new THREE.Fog('#030303',25,55);

var camera=new THREE.PerspectiveCamera(75,window.innerWidth/window.innerHeight,.1,100);
camera.position.set(0,20,6);camera.lookAt(0,0,0);

var renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.2;
document.body.prepend(renderer.domElement);

// ─── Lights ────────────────────────────────────────────────────
var amb=new THREE.AmbientLight('#222244',.4);
scene.add(amb);
var dir=new THREE.DirectionalLight('#ffeecc',2.8);
dir.position.set(-8,20,6);
dir.castShadow=true;
dir.shadow.mapSize.set(1024,1024);
dir.shadow.camera.near=.5;dir.shadow.camera.far=40;
dir.shadow.camera.left=-20;dir.shadow.camera.right=20;
dir.shadow.camera.top=20;dir.shadow.camera.bottom=-20;
scene.add(dir);
var rim=new THREE.DirectionalLight('#4488ff',.6);
rim.position.set(5,3,-8);
scene.add(rim);

// ─── Arena ──────────────────────────────────────────────────────
var floor=new THREE.Mesh(
  new THREE.PlaneGeometry(36,36),
  new THREE.MeshStandardMaterial({color:'#0a0a0f',roughness:.9,metalness:.1})
);
floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;
scene.add(floor);

// Grid lines
var grid=new THREE.GridHelper(32,32,'#ffffff','#ffffff');
grid.material.transparent=true;grid.material.opacity=.04;
scene.add(grid);

// Walls (glowing edge markers)
var wallMat=new THREE.MeshBasicMaterial({color:'#1a1a2e',transparent:true,opacity:.5,side:THREE.DoubleSide});
var wallPos=[[-18,0,0,1,6,36],[18,0,0,1,6,36],[0,0,-18,36,6,1],[0,0,18,36,6,1]];
wallPos.forEach(function(p){var w=new THREE.Mesh(new THREE.BoxGeometry(p[3],p[4],p[5]),wallMat);w.position.set(p[0],p[1],p[2]);scene.add(w)});

// ─── Player ────────────────────────────────────────────────────
var player={hp:100,maxHp:100,score:0,wave:1,kills:0,speed:8,r:.5};
var pBody=new THREE.Mesh(
  new THREE.SphereGeometry(.5,16,16),
  new THREE.MeshStandardMaterial({color:'#eee',roughness:.2,metalness:.1,emissive:'#4488ff',emissiveIntensity:.15})
);
pBody.castShadow=true;pBody.position.set(0,.5,0);
scene.add(pBody);

var pGlow=new THREE.Mesh(
  new THREE.SphereGeometry(.9,16,16),
  new THREE.MeshBasicMaterial({color:'#4488ff',transparent:true,opacity:.08})
);
pGlow.position.copy(pBody.position);
scene.add(pGlow);

var pLight=new THREE.PointLight('#4488ff',.6,6);
pLight.position.copy(pBody.position);
scene.add(pLight);

// ─── Enemies ───────────────────────────────────────────────────
var enemies=[];
var enemyPool=[];
var eMat=new THREE.MeshStandardMaterial({color:'#ff3333',roughness:.3,metalness:.1,emissive:'#ff2200',emissiveIntensity:.6});

// ─── Projectiles ───────────────────────────────────────────────
var projectiles=[];
var projPool=[];

// ─── Pickups ────────────────────────────────────────────────────
var pickups=[];

// ─── Input ─────────────────────────────────────────────────────
var keys={};
window.addEventListener('keydown',function(e){keys[e.key.toLowerCase()]=true});
window.addEventListener('keyup',function(e){keys[e.key.toLowerCase()]=false});
window.addEventListener('mousemove',function(e){player.mx=e.clientX;player.my=e.clientY});
// Touch
window.addEventListener('touchmove',function(e){var t=e.touches[0];player.mx=t.clientX;player.my=t.clientY},{passive:true});

// ─── Game state ────────────────────────────────────────────────
var state='menu';var gameTime=0;var waveTimer=0;
var spawnCount=0;var enemiesPerWave=3;

function start(){
  state='play';gameTime=0;waveTimer=0;
  player.hp=player.maxHp=100;player.score=0;player.wave=1;player.kills=0;
  player.vx=0;player.vz=0;
  pBody.position.set(0,.5,0);
  clearEnemies();clearProjectiles();clearPickups();
  spawnCount=0;enemiesPerWave=3;
  // Spawn initial enemies
  for(var _i=0;_i<2;_i++)spawnEnemy();
  document.getElementById('start').classList.add('hide');
  document.getElementById('over').classList.remove('show');
  updateHUD();
}
function end(){
  state='over';
  document.getElementById('final-sc').textContent=player.score;
  document.getElementById('final-wa').textContent='Wave '+player.wave;
  document.getElementById('over').classList.add('show');
}
function updateHUD(){
  var pct=Math.max(0,player.hp/player.maxHp)*100;
  document.getElementById('hp-fill').style.width=pct+'%';
  document.getElementById('score').textContent=player.score;
  document.getElementById('wave').textContent='Wave '+player.wave;
}

// ─── Entity helpers ────────────────────────────────────────────
function spawnEnemy(){
  var m=new THREE.MeshStandardMaterial({color:'#ff4444',roughness:.3,metalness:.1,emissive:'#ff3300',emissiveIntensity:.8});
  var mesh= enemyPool.length? enemyPool.pop():new THREE.Mesh(new THREE.SphereGeometry(.75,12,12),m);
  mesh.material=m;
  // spawn from edge
  var angle=Math.random()*Math.PI*2,dist=9+Math.random()*5;
  mesh.position.set(Math.cos(angle)*dist,.5,Math.sin(angle)*dist);
  mesh.scale.set(1,1,1);
  mesh.castShadow=true;mesh.receiveShadow=true;
  scene.add(mesh);
  // Enemy glow light
  var eLight=new THREE.PointLight('#ff4422',.4,5);
  eLight.position.copy(mesh.position);
  scene.add(eLight);
  var e={mesh,hp:5+player.wave*.5,spd:1+Math.random()*.5+player.wave*.04,vx:0,vz:0,damage:10+player.wave*2,light:eLight};
  enemies.push(e);
}
function clearEnemies(){
  enemies.forEach(function(e){e.mesh.material.dispose();scene.remove(e.mesh);scene.remove(e.light);enemyPool.push(e.mesh)});
  enemies=[]
}

function spawnProjectile(x,z,dx,dz){
  var m= projPool.length? projPool.pop():new THREE.Mesh(
    new THREE.SphereGeometry(.12,8,8),
    new THREE.MeshBasicMaterial({color:'#88bbff'})
  );
  m.position.set(x,.3,z);m.scale.set(1,1,1);
  scene.add(m);
  var sp=18+Math.random()*3;
  projectiles.push({mesh:m,vx:dx*sp,vz:dz*sp,life:40});
}
function clearProjectiles(){
  projectiles.forEach(function(p){scene.remove(p.mesh);projPool.push(p.mesh)});
  projectiles=[]
}

function spawnPickup(x,z){
  var m=new THREE.Mesh(
    new THREE.OctahedronGeometry(.3),
    new THREE.MeshStandardMaterial({color:'#44ff88',emissive:'#44ff88',emissiveIntensity:.2,roughness:.3,metalness:.5})
  );
  m.position.set(x,.5,z);m.castShadow=true;
  scene.add(m);
  pickups.push({mesh:m,life:600, bob:0});
}

function clearPickups(){
  pickups.forEach(function(p){scene.remove(p.mesh)});
  pickups=[]
}

// ─── Update ────────────────────────────────────────────────────
function update(dt){
  if(state!=='play')return;
  gameTime+=dt;

  // Player movement
  var mx=0,mz=0;
  if(keys['w']||keys['arrowup'])mz=-1;
  if(keys['s']||keys['arrowdown'])mz=1;
  if(keys['a']||keys['arrowleft'])mx=-1;
  if(keys['d']||keys['arrowright'])mx=1;
  if(mx&&mz){mx*=0.707;mz*=0.707}
  player.vx+=((mx*player.speed)-player.vx)*.15;
  player.vz+=((mz*player.speed)-player.vz)*.15;
  pBody.position.x+=player.vx*dt;
  pBody.position.z+=player.vz*dt;
  // Arena bounds
  var b=16.5;
  pBody.position.x=Math.max(-b,Math.min(b,pBody.position.x));
  pBody.position.z=Math.max(-b,Math.min(b,pBody.position.z));
  pBody.position.y=.5;
  pGlow.position.copy(pBody.position);
  pLight.position.copy(pBody.position);

  // Manual shoot on click
  if(player._shoot&&player.mx!==void 0){
    player._shoot=false;
    var raycaster=new THREE.Raycaster();
    raycaster.setFromCamera(new THREE.Vector2(
      (player.mx/window.innerWidth)*2-1,
      -(player.my/window.innerHeight)*2+1
    ),camera);
    var plane=new THREE.Plane(new THREE.Vector3(0,1,0),0);
    var pt=new THREE.Vector3();
    raycaster.ray.intersectPlane(plane,pt);
    if(pt){
      var dx=pt.x-pBody.position.x,dz=pt.z-pBody.position.z;
      var d=Math.hypot(dx,dz);
      if(d>.5){dx/=d;dz/=d}
      spawnProjectile(pBody.position.x,pBody.position.z,dx,dz);
    }
  }

  // Projectiles
  for(var i=projectiles.length-1;i>=0;i--){
    var p=projectiles[i];
    p.mesh.position.x+=p.vx*dt;
    p.mesh.position.z+=p.vz*dt;
    p.life--;
    var hit=false;
    // Check enemy hits
    for(var j=enemies.length-1;j>=0;j--){
      var e=enemies[j];
      if(Math.hypot(p.mesh.position.x-e.mesh.position.x,p.mesh.position.z-e.mesh.position.z)<.7){
        e.hp--;
        if(e.hp<=0){
          player.score+=10+player.wave*5;
          player.kills++;
          // Death burst particles
          for(var k=0;k<8;k++){
            var a=Math.random()*Math.PI*2,s=.5+Math.random()*1.5;
            spawnParticle(e.mesh.position.x,.5,e.mesh.position.z,Math.cos(a)*s,Math.sin(a)*s,'#ff6644')
          }
          e.mesh.material.dispose();
          scene.remove(e.mesh);scene.remove(e.light);enemyPool.push(e.mesh);
          enemies.splice(j,1)
        }
        hit=true;break
      }
    }
    if(hit||p.life<=0||Math.abs(p.mesh.position.x)>18||Math.abs(p.mesh.position.z)>18){
      scene.remove(p.mesh);projPool.push(p.mesh);
      projectiles.splice(i,1)
    }
  }

  // Enemies
  for(var i=enemies.length-1;i>=0;i--){
    var e=enemies[i];
    var dx=pBody.position.x-e.mesh.position.x,dz=pBody.position.z-e.mesh.position.z;
    var d=Math.hypot(dx,dz);
    if(d>.5){
      e.vx+=(dx/d*e.spd-e.vx)*.04;
      e.vz+=(dz/d*e.spd-e.vz)*.04;
    }
    e.mesh.position.x+=e.vx;e.mesh.position.z+=e.vz;
    e.light.position.copy(e.mesh.position);
    // Keep in bounds
    e.mesh.position.x=Math.max(-17,Math.min(17,e.mesh.position.x));
    e.mesh.position.z=Math.max(-17,Math.min(17,e.mesh.position.z));
    e.mesh.position.y=.5;

    // Collision with player
    if(d<.7){
      player.hp-=e.damage*dt*1.5;
      // Knockback
      if(d>.01){
        var push=.5/d;
        e.mesh.position.x-=dx*push;e.mesh.position.z-=dz*push;
        pBody.position.x+=dx*push*.3;pBody.position.z+=dz*push*.3
      }
      // Red flash on player
      pBody.material.emissiveIntensity=.8;
      updateHUD();
      if(player.hp<=0){end();return}
    }
    // Floating bob
    e.mesh.position.y=.5+Math.sin(gameTime*2+i)*.05;
  }
  pBody.material.emissiveIntensity+=(.15-pBody.material.emissiveIntensity)*.06;

  // Pickups
  for(var i=pickups.length-1;i>=0;i--){
    var pk=pickups[i];
    pk.life--;pk.bob+=dt;
    pk.mesh.position.y=.5+Math.sin(pk.bob*3)*.15;
    pk.mesh.rotation.x+=dt*2;pk.mesh.rotation.z+=dt*1.3;
    var d=Math.hypot(pBody.position.x-pk.mesh.position.x,pBody.position.z-pk.mesh.position.z);
    if(d<.8){
      player.hp=Math.min(player.maxHp,player.hp+25);
      updateHUD();
      scene.remove(pk.mesh);pickups.splice(i,1)
    }else if(pk.life<=0||Math.abs(pk.mesh.position.x)>18||Math.abs(pk.mesh.position.z)>18){
      scene.remove(pk.mesh);pickups.splice(i,1)
    }
  }

  // Particle system (simple)
  updateParticles(dt);

  // Wave spawner
  waveTimer+=dt;
  if(waveTimer>2){ // check every 2s
    waveTimer=0;
    if(enemies.length<enemiesPerWave+player.wave){
      spawnEnemy();
      if(Math.random()<.3&&pickups.length<3){spawnPickup((Math.random()-.5)*20,.5,(Math.random()-.5)*20)}
    }
    // Wave complete check
    var total=0;
    enemies.forEach(function(){total++});
    if(total===0&&spawnCount>0){
      player.wave++;
      enemiesPerWave=Math.min(15,enemiesPerWave+1);
      spawnCount=0;
      document.getElementById('wave').textContent='Wave '+player.wave;
    }
  }

  // Score over time (1 per second)
  player._scoreTimer=(player._scoreTimer||0)+dt;
  if(player._scoreTimer>=1){player._scoreTimer-=1;player.score+=1}
  updateHUD();
}

// ─── Particles ─────────────────────────────────────────────────
var particles=[];
function spawnParticle(x,y,z,vx,vz,col){
  var geo=new THREE.SphereGeometry(.05+Math.random()*.06,4,4);
  var mat=new THREE.MeshBasicMaterial({color:col||'#fff',transparent:true,opacity:1});
  var m=new THREE.Mesh(geo,mat);
  m.position.set(x,y,z);
  scene.add(m);
  particles.push({mesh:m,vx:vx||0,vy:(Math.random()-.5)*2,vz:vz||0,life:20+Math.random()*20})
}
function updateParticles(dt){
  for(var i=particles.length-1;i>=0;i--){
    var p=particles[i];
    p.mesh.position.x+=p.vx*dt;
    p.mesh.position.y+=p.vy*dt;
    p.mesh.position.z+=p.vz*dt;
    p.vy-=.8*dt;
    p.life--;
    p.mesh.material.opacity=p.life/40;
    if(p.life<=0){p.mesh.geometry.dispose();p.mesh.material.dispose();scene.remove(p.mesh);particles.splice(i,1)}
  }
}

// ─── Camera ────────────────────────────────────────────────────
function updateCamera(){
  var px=pBody.position.x,pz=pBody.position.z;
  camera.position.x=px;camera.position.z=pz+6;
  camera.position.y=20+Math.max(0,-pz*.03);
  camera.lookAt(px,0,pz)
}

// ─── Loop ──────────────────────────────────────────────────────
var last=0;
function loop(t){
  var dt=Math.min((t-last)/1000,.05);
  last=t;
  update(dt);
  updateCamera();
  renderer.render(scene,camera);
  requestAnimationFrame(loop)
}
requestAnimationFrame(function(t){last=t;loop(t)});

// ─── Resize ────────────────────────────────────────────────────
window.addEventListener('resize',function(){
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight)
});

// ─── Crosshair follow ──────────────────────────────────────────
window.addEventListener('mousemove',function(e){
  var ch=document.getElementById('crosshair');
  if(ch){ch.style.left=e.clientX+'px';ch.style.top=e.clientY+'px'}
});

// ─── Click handlers ────────────────────────────────────────────
window.addEventListener('mousedown',function(){
  if(state==='play')player._shoot=true
});
window.addEventListener('click',function(){
  if(state==='menu')start();
  else if(state==='over')start()
});
window.addEventListener('keydown',function(e){
  if((e.key===' '||e.key==='Enter')&&state!=='play'){
    if(state==='menu')start();
    else if(state==='over')start()
  }
});
</script>
</body>
</html>
