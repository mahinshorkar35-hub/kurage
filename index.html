<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Kurage · Dodge</title>
<style>
*{margin:0;padding:0}
body{background:#000;overflow:hidden;height:100dvh;cursor:crosshair;font-family:system-ui,-apple-system,sans-serif}
canvas{display:block}
#ui{position:fixed;inset:0;pointer-events:none;z-index:10}
#score{position:fixed;top:1.5rem;right:2rem;font-size:1rem;font-weight:700;color:rgba(255,255,255,.3);letter-spacing:.1em;z-index:10}
#over{position:fixed;inset:0;display:none;place-items:center;z-index:20}
#over.show{display:grid}
#over div{text-align:center}
#over h1{font-size:3rem;font-weight:800;letter-spacing:-.04em;color:#fff;margin-bottom:.5rem}
#over p{color:rgba(255,255,255,.25);font-size:.85rem;letter-spacing:.1em;text-transform:uppercase}
#over .final{margin-top:2rem;font-size:1.4rem;font-weight:700;color:rgba(255,255,255,.5)}
#start{position:fixed;inset:0;display:grid;place-items:center;z-index:15;cursor:pointer}
#start.hide{display:none}
#start h1{font-size:clamp(2.5rem,8vw,5rem);font-weight:800;letter-spacing:-.04em;color:#fff;margin-bottom:.75rem}
#start p{color:rgba(255,255,255,.25);font-size:.85rem;letter-spacing:.1em;text-transform:uppercase}
#start .keys{margin-top:2rem;display:flex;gap:.5rem;justify-content:center}
#start .keys kbd{border:1px solid rgba(255,255,255,.1);padding:.35rem .7rem;font-size:.7rem;color:rgba(255,255,255,.15);border-radius:0;font-family:inherit;letter-spacing:.05em}
</style>
</head>
<body>

<canvas id="c"></canvas>
<div id="score">0</div>

<div id="start">
  <div style="text-align:center">
    <h1>Dodge</h1>
    <p>Survive as long as you can</p>
    <div class="keys"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd><kbd>or</kbd><kbd>←</kbd><kbd>↑</kbd><kbd>→</kbd><kbd>↓</kbd></div>
    <p style="margin-top:2rem;color:rgba(255,255,255,.08);font-size:.7rem">click to start</p>
  </div>
</div>

<div id="over">
  <div>
    <h1>Lost</h1>
    <p class="final" id="final">0</p>
    <p style="margin-top:1.5rem;color:rgba(255,255,255,.08)">click to retry</p>
  </div>
</div>

<script>
var c=document.getElementById('c'),ctx=c.getContext('2d');
var W,H;

function resize(){
  W=c.width=window.innerWidth;
  H=c.height=window.innerHeight;
}
resize();
window.addEventListener('resize',resize);

// ─── Game state ────────────────────────────────────────────────
var state='menu'; // menu|play|over
var score=0;
var player={x:W/2,y:H/2,r:8,vx:0,vy:0};
var enemies=[];
var particles=[];
var spawnTimer=0;
var spawnRate=800; // ms between spawns, decreases

// ─── Input ─────────────────────────────────────────────────────
var keys={};
window.addEventListener('keydown',function(e){keys[e.key]=true;e.preventDefault()});
window.addEventListener('keyup',function(e){keys[e.key]=false});

function startGame(){
  state='play';score=0;
  player.x=W/2;player.y=H/2;player.vx=0;player.vy=0;
  enemies=[];particles=[];
  spawnTimer=0;spawnRate=800;
  document.getElementById('score').textContent='0';
  document.getElementById('start').classList.add('hide');
  document.getElementById('over').classList.remove('show');
}
function endGame(){
  state='over';
  document.getElementById('final').textContent=score;
  document.getElementById('over').classList.add('show');
}

// ─── Entities ──────────────────────────────────────────────────
function spawnEnemy(){
  var side=Math.floor(Math.random()*4);
  var x,y,vx,vy;
  if(side===0){x=-20;y=Math.random()*H;vx=1+Math.random()*1.5;vy=(Math.random()-.5)*1.2}
  else if(side===1){x=W+20;y=Math.random()*H;vx=-(1+Math.random()*1.5);vy=(Math.random()-.5)*1.2}
  else if(side===2){x=Math.random()*W;y=-20;vy=1+Math.random()*1.5;vx=(Math.random()-.5)*1.2}
  else{x=Math.random()*W;y=H+20;vy=-(1+Math.random()*1.5);vx=(Math.random()-.5)*1.2}
  enemies.push({x,y,vx,vy,r:4+Math.random()*5,hp:1});
}

function spawnParticles(x,y,n,col,spd){
  for(var i=0;i<n;i++){
    var a=Math.random()*Math.PI*2,s=Math.random()*spd;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:1+Math.random()*2,col:col||'rgba(255,255,255,.5)',life:30+Math.random()*40})
  }
}

// ─── Update ────────────────────────────────────────────────────
function update(dt){
  if(state!=='play')return;
  var ms=dt*1000;

  // Player movement
  var mx=0,my=0;
  if(keys['w']||keys['W']||keys['ArrowUp'])my=-1;
  if(keys['s']||keys['S']||keys['ArrowDown'])my=1;
  if(keys['a']||keys['A']||keys['ArrowLeft'])mx=-1;
  if(keys['d']||keys['D']||keys['ArrowRight'])mx=1;
  var speed=280;
  if(mx&&my){mx*=0.707;my*=0.707}
  player.vx+=((mx*speed)-player.vx)*.18;
  player.vy+=((my*speed)-player.vy)*.18;
  player.x+=player.vx*dt;
  player.y+=player.vy*dt;
  // Clamp
  player.x=Math.max(player.r,Math.min(W-player.r,player.x));
  player.y=Math.max(player.r,Math.min(H-player.r,player.y));

  // Spawn enemies
  spawnTimer+=ms;
  if(spawnTimer>spawnRate){
    spawnTimer=0;
    spawnEnemy();
    spawnRate=Math.max(200,spawnRate-2); // ponytail: linear difficulty ramp, add curve if plateau
  }

  // Update enemies
  for(var i=enemies.length-1;i>=0;i--){
    var e=enemies[i];
    // drift toward player (subtle homing)
    var dx=player.x-e.x,dy=player.y-e.y,d=Math.hypot(dx,dy);
    if(d>1){e.vx+=(dx/d*.04);e.vy+=(dy/d*.04)}
    // cap speed
    var sp=Math.hypot(e.vx,e.vy);
    if(sp>3.5){e.vx=e.vx/sp*3.5;e.vy=e.vy/sp*3.5}
    e.x+=e.vx;e.y+=e.vy;
    // remove if off screen (far)
    if(e.x<-100||e.x>W+100||e.y<-100||e.y>H+100){enemies.splice(i,1);continue}
    // collision with player
    if(d<player.r+e.r){
      // Death burst
      spawnParticles(player.x,player.y,80,'rgba(255,180,50,.8)',8);
      spawnParticles(player.x,player.y,40,'rgba(255,255,255,.6)',12);
      endGame();
      return
    }
  }

  // Score
  score+=Math.floor(ms*.1);
  document.getElementById('score').textContent=score;

  // Particles
  for(var i=particles.length-1;i>=0;i--){
    var p=particles[i];
    p.x+=p.vx;p.y+=p.vy;
    p.vx*=.97;p.vy*=.97;
    p.life--;
    if(p.life<=0||p.x<0||p.x>W||p.y<0||p.y>H)particles.splice(i,1)
  }
}

// ─── Draw ──────────────────────────────────────────────────────
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);

  // Grid (subtle)
  ctx.strokeStyle='rgba(255,255,255,.02)';ctx.lineWidth=1;
  for(var x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
  for(var y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}

  // Enemies
  for(var i=0;i<enemies.length;i++){
    var e=enemies[i];
    var grad=ctx.createRadialGradient(e.x,e.y,0,e.x,e.y,e.r*2.5);
    grad.addColorStop(0,'rgba(255,80,80,.9)');
    grad.addColorStop(.4,'rgba(200,40,40,.5)');
    grad.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=grad;
    ctx.beginPath();ctx.arc(e.x,e.y,e.r*2.5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,100,100,.95)';
    ctx.beginPath();ctx.arc(e.x,e.y,e.r*.7,0,Math.PI*2);ctx.fill()
  }

  // Player (glow orb)
  var pg=ctx.createRadialGradient(player.x,player.y,0,player.x,player.y,player.r*4);
  pg.addColorStop(0,'rgba(255,255,255,.95)');
  pg.addColorStop(.15,'rgba(200,220,255,.6)');
  pg.addColorStop(.5,'rgba(100,150,255,.2)');
  pg.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=pg;
  ctx.beginPath();ctx.arc(player.x,player.y,player.r*4,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.arc(player.x,player.y,player.r*.8,0,Math.PI*2);ctx.fill();

  // Particles
  for(var i=0;i<particles.length;i++){
    var p=particles[i];
    ctx.globalAlpha=p.life/70;
    ctx.fillStyle=p.col||'rgba(255,255,255,.5)';
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()
  }
  ctx.globalAlpha=1;
}

// ─── Loop ──────────────────────────────────────────────────────
var last=0;
function loop(t){
  var dt=Math.min((t-last)/1000,.05);
  last=t;
  update(dt);
  draw();
  requestAnimationFrame(loop)
}
requestAnimationFrame(function(t){last=t;loop(t)});

// ─── Click handlers ────────────────────────────────────────────
window.addEventListener('click',function(){
  if(state==='menu')startGame();
  else if(state==='over')startGame()
});
window.addEventListener('keydown',function(e){
  if((e.key===' '||e.key==='Enter')&&state!=='play'){
    if(state==='menu')startGame();
    else if(state==='over')startGame()
  }
});

// Resize handler updates player bounds
window.addEventListener('resize',function(){
  resize();
  player.x=Math.max(player.r,Math.min(W-player.r,player.x));
  player.y=Math.max(player.r,Math.min(H-player.r,player.y));
});
</script>
</body>
</html>
