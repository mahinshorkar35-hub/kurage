<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Reveal Hover — Demo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#fff;font-family:system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:2rem}

h1{font-size:1rem;font-weight:400;text-transform:uppercase;letter-spacing:.12em;color:#888;margin-bottom:3rem}

.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:2rem;max-width:1000px;width:100%}

.reveal-hover{position:relative;overflow:clip;isolation:isolate;contain:paint;background:#111;border-radius:0;cursor:crosshair;width:100%;aspect-ratio:16/10}
.reveal-hover__image{display:block;width:100%;height:100%;object-fit:cover;object-position:center;user-select:none;-webkit-user-select:none}
.reveal-hover__image--base{position:relative;z-index:0;filter:grayscale(1) contrast(1.1)}
.reveal-hover__image--overlay{position:absolute;z-index:1;inset:0;pointer-events:none;
  -webkit-mask-image:radial-gradient(circle var(--reveal-radius,0px) at var(--reveal-x,50%) var(--reveal-y,50%),
    rgb(0 0 0 / 1) 0%,rgb(0 0 0 / 1) 40%,rgb(0 0 0 / .75) 60%,rgb(0 0 0 / .4) 75%,rgb(0 0 0 / .12) 88%,transparent 100%);
  mask-image:radial-gradient(circle var(--reveal-radius,0px) at var(--reveal-x,50%) var(--reveal-y,50%),
    rgb(0 0 0 / 1) 0%,rgb(0 0 0 / 1) 40%,rgb(0 0 0 / .75) 60%,rgb(0 0 0 / .4) 75%,rgb(0 0 0 / .12) 88%,transparent 100%);
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
.reveal-hover__label{position:absolute;bottom:1rem;left:1rem;z-index:2;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.5);pointer-events:none}

@media(hover:none),(pointer:coarse){.reveal-hover__image--overlay{display:none}}
</style>
</head>
<body>

<h1>Reveal Hover — Spotlight reveals color under your cursor</h1>

<div class="gallery">
  <figure class="reveal-hover" data-reveal-hover data-reveal-radius="220">
    <img class="reveal-hover__image reveal-hover__image--base" src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=800&q=80" alt="" width="800" height="500" decoding="async" loading="lazy"/>
    <img class="reveal-hover__image reveal-hover__image--overlay" src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=800&q=80" alt="" aria-hidden="true" width="800" height="500" decoding="async" loading="lazy"/>
    <span class="reveal-hover__label">move cursor →</span>
  </figure>

  <figure class="reveal-hover" data-reveal-hover data-reveal-radius="220">
    <img class="reveal-hover__image reveal-hover__image--base" src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=800&q=80" alt="" width="800" height="500" decoding="async" loading="lazy"/>
    <img class="reveal-hover__image reveal-hover__image--overlay" src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=800&q=80" alt="" aria-hidden="true" width="800" height="500" decoding="async" loading="lazy"/>
    <span class="reveal-hover__label">move cursor →</span>
  </figure>

  <figure class="reveal-hover" data-reveal-hover data-reveal-radius="220">
    <img class="reveal-hover__image reveal-hover__image--base" src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=800&q=80" alt="" width="800" height="500" decoding="async" loading="lazy"/>
    <img class="reveal-hover__image reveal-hover__image--overlay" src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=800&q=80" alt="" aria-hidden="true" width="800" height="500" decoding="async" loading="lazy"/>
    <span class="reveal-hover__label">move cursor →</span>
  </figure>

  <figure class="reveal-hover" data-reveal-hover data-reveal-radius="220">
    <img class="reveal-hover__image reveal-hover__image--base" src="https://images.unsplash.com/photo-1505144808419-1957a94ca61e?w=800&q=80" alt="" width="800" height="500" decoding="async" loading="lazy"/>
    <img class="reveal-hover__image reveal-hover__image--overlay" src="https://images.unsplash.com/photo-1505144808419-1957a94ca61e?w=800&q=80" alt="" aria-hidden="true" width="800" height="500" decoding="async" loading="lazy"/>
    <span class="reveal-hover__label">move cursor →</span>
  </figure>
</div>

<script>
function initRevealHover(element) {
  const overlay = element.querySelector(".reveal-hover__image--overlay");
  const finePointer = window.matchMedia("(hover: hover) and (pointer: fine)");
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
  if (!overlay || !finePointer.matches) return () => {};

  const state = {x:0,y:0,targetX:0,targetY:0,radius:0,targetRadius:0,clientX:0,clientY:0,inside:false,frame:0};

  const getRadius = () => {
    const r = Number.parseFloat(element.dataset.revealRadius);
    return Number.isFinite(r) ? r : Math.min(260, Math.max(140, element.clientWidth * 0.22));
  };

  const schedule = () => { if (!state.frame) state.frame = requestAnimationFrame(tick); };

  const tick = () => {
    state.frame = 0;
    const pe = reduceMotion.matches ? 1 : 0.1;
    const re = reduceMotion.matches ? 1 : 0.14;
    state.x += (state.targetX - state.x) * pe;
    state.y += (state.targetY - state.y) * pe;
    state.radius += (state.targetRadius - state.radius) * re;
    element.style.setProperty("--reveal-x", state.x.toFixed(2) + "px");
    element.style.setProperty("--reveal-y", state.y.toFixed(2) + "px");
    element.style.setProperty("--reveal-radius", state.radius.toFixed(2) + "px");
    if (Math.abs(state.targetX - state.x) > 0.1 || Math.abs(state.targetY - state.y) > 0.1 || Math.abs(state.targetRadius - state.radius) > 0.1) schedule();
  };

  const updateTarget = (cx, cy) => {
    const rect = element.getBoundingClientRect();
    state.clientX = cx; state.clientY = cy;
    state.targetX = cx - rect.left; state.targetY = cy - rect.top;
  };

  element.addEventListener("pointerenter", e => { state.inside = true; updateTarget(e.clientX, e.clientY); if (state.radius < 0.5) { state.x = state.targetX; state.y = state.targetY; } state.targetRadius = getRadius(); schedule(); });
  element.addEventListener("pointermove", e => { updateTarget(e.clientX, e.clientY); if (!state.inside) { state.inside = true; if (state.radius < 0.5) { state.x = state.targetX; state.y = state.targetY; } state.targetRadius = getRadius(); } schedule(); });
  element.addEventListener("pointerleave", () => { state.inside = false; state.targetRadius = 0; schedule(); });
  element.addEventListener("pointercancel", () => { state.inside = false; state.targetRadius = 0; schedule(); });

  window.addEventListener("blur", () => { state.inside = false; state.targetRadius = 0; schedule(); });
  window.addEventListener("scroll", () => { if (state.inside) { updateTarget(state.clientX, state.clientY); state.targetRadius = getRadius(); schedule(); } }, { passive: true });

  const ro = new ResizeObserver(() => { if (state.inside) { updateTarget(state.clientX, state.clientY); state.targetRadius = getRadius(); schedule(); } });
  ro.observe(element);

  return () => { if (state.frame) cancelAnimationFrame(state.frame); ro.disconnect(); };
}

document.querySelectorAll("[data-reveal-hover]").forEach(initRevealHover);
</script>
</body>
</html>
